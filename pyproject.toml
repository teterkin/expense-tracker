[project]
name = "expense-tracker"
version = "0.1.0"
description = "Console expense tracker backed by SQLite"
readme = "README.md"
authors = [
    { name = "Alexander Teterkin", email = "amteterkin@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
